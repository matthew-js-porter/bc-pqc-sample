spring.application.name=pqc-demo

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# SSL Configuration
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore/pqcdemo.p12
server.ssl.key-store-password=password
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=pqcdemo

# Configure SSL provider to use Bouncy Castle
server.ssl.provider=BCJSSE
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3

# Enable debug for SSL
logging.level.org.springframework.web=DEBUG
logging.level.org.apache.tomcat.util.net=DEBUG

# ML-KEM TLS Configuration
# These properties help ensure ML-KEM is used when available
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256
